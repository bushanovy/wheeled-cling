# Example reusable surface graph for surface_goal_planner.py.
#
# Pass this file with:
#   surface_graph_yaml:=/path/to/surface_graph_example.yaml
#
# Units are meters in the world frame. Polygon vertices should be ordered around
# the face boundary. Cylinders use local coordinates:
#   u = axis coordinate, v = angle in radians.

cost_weights:
  distance: 1.0
  transition: 1.0
  adhesion: 2.0
  edge: 1.5
  gravity: 1.0
  turn: 0.25
  heuristic: 1.0
  edge_margin_m: 0.10

surfaces:
  - name: wall_panel
    type: polygon
    adhesion_quality: 1.0
    edge_risk: 0.0
    slip_risk: 0.0
    vertices:
      - [0.95, -1.5, 0.0]
      - [0.95, 1.5, 0.0]
      - [0.95, 1.5, 3.0]
      - [0.95, -1.5, 3.0]
    neighbors: [inspection_pipe]

  - name: inspection_pipe
    type: cylinder
    adhesion_quality: 0.9
    edge_risk: 0.1
    slip_risk: 0.1
    axis: z
    axis_point: [0.5, 0.0, 1.5]
    radius: 0.45
    length: 3.0
    neighbors: [wall_panel]

transitions:
  - from: wall_panel
    to: inspection_pipe
    cost: 2.0
    risk: 0.4
    point: [0.95, 0.0, 1.5]
