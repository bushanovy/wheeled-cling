controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    swerve_controller:
      type: swerve_controller/SwerveController

swerve_controller:
  ros__parameters:
    wheel_1_joint: "wheel_1_joint"
    wheel_2_joint: "wheel_2_joint"
    wheel_3_joint: "wheel_3_joint"
    steering_1_joint: "steering_1_joint"
    steering_2_joint: "steering_2_joint"
    steering_3_joint: "steering_3_joint"
    robot_circumradius: 0.41405
    wheel_radius: 0.05
    cmd_vel_timeout: 1.5
    use_stamped_vel: true 
    prefer_reverse_over_steering: true
    steering_flip_hysteresis_rad: 0.08
    max_steering_rate_rad_s: 1.2
    steering_command_deadband_rad: 0.002
    steering_velocity_full_error_rad: 0.08
    steering_velocity_stop_error_rad: 0.45
    
